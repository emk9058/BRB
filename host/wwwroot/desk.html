<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BRB</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #010a13;
        --panel: #1e2328;
        --ink: #f0e6d2;
        --gold: #c8aa6e;
        --gold-soft: #cdbe91;
        --muted: #a09b8c;
        --teal: #0ac8b9;
        --red: #ee241d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
        background:
          radial-gradient(ellipse at top, rgba(10, 200, 185, 0.08), transparent 42%),
          var(--bg) url("/magic-background.jpg") center / cover no-repeat;
        color: var(--ink);
        font: 16px/1.4 "Segoe UI", sans-serif;
      }
      main {
        width: min(40rem, 100%);
        padding: 1.6rem 1.4rem 1.4rem;
        background: linear-gradient(180deg, rgba(16, 28, 40, 0.94), rgba(6, 14, 24, 0.96));
        border: 2px solid transparent;
        border-image: linear-gradient(to top, #614a1f, #c8aa6e 45%, #f0e6d2) 1;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
        text-align: center;
      }
      p { margin: 0; }
      .kicker {
        color: var(--gold);
        font-size: 0.75rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0.3rem 0 0.4rem;
        font-family: "Times New Roman", serif;
        font-size: 2.4rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .lead { color: var(--muted); }
      .code {
        display: grid;
        place-items: center;
        width: 15rem;
        height: 15rem;
        margin: 1.3rem auto 0.8rem;
        background: #fff;
      }
      .code img { width: 13.4rem; height: 13.4rem; }
      .url {
        margin: 0;
        color: var(--gold-soft);
        font-size: 1.15rem;
        word-break: break-all;
      }
      .alts { margin-top: 0.45rem; color: var(--muted); font-size: 0.85rem; }
      .status {
        display: flex;
        justify-content: center;
        gap: 0.6rem;
        margin-top: 1.2rem;
      }
      .pill {
        min-width: 9rem;
        padding: 0.55rem 0.7rem;
        background: rgba(1, 10, 19, 0.65);
        border: 1px solid rgba(200, 170, 110, 0.45);
      }
      .pill span {
        display: block;
        color: var(--gold);
        font-size: 0.68rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .pill strong { font-weight: 500; }
      .pill.bad strong { color: #ffb4b0; }
      .pill.good strong { color: var(--teal); }
      .note { margin-top: 1rem; color: var(--muted); font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">This PC</p>
      <h1>BRB</h1>
      <p class="lead">Scan with a phone on the same Wi-Fi.</p>
      <div class="code"><img id="qr" alt="QR code for the phone page" /></div>
      <p class="url" id="url">Looking for this PC’s address…</p>
      <p class="alts" id="alts"></p>
      <div class="status">
        <div class="pill" id="app-pill">
          <span>Phone page</span>
          <strong>Checking</strong>
        </div>
        <div class="pill" id="league-pill">
          <span>League</span>
          <strong>Checking</strong>
        </div>
      </div>
      <p class="note" id="note"></p>
    </main>
    <script>
      const url = document.querySelector("#url")
      const alts = document.querySelector("#alts")
      const qr = document.querySelector("#qr")
      const appPill = document.querySelector("#app-pill")
      const leaguePill = document.querySelector("#league-pill")
      const note = document.querySelector("#note")
      let qrSet = false

      function pill(node, text, kind) {
        node.className = "pill " + (kind || "")
        node.querySelector("strong").textContent = text
      }

      async function tick() {
        try {
          const response = await fetch("/api/host")
          if (!response.ok) throw new Error("status")
          const data = await response.json()
          if (data.url) {
            url.textContent = data.url
            if (!qrSet) {
              qr.src = "/host/qr"
              qrSet = true
            }
          } else {
            url.textContent = "No Wi-Fi address yet."
          }
          const extra = (data.urls || []).filter(item => item !== data.url)
          alts.textContent = extra.length ? "Also works: " + extra.join("  ·  ") : ""
          pill(appPill, data.pageReady ? "Ready" : "Not built", data.pageReady ? "good" : "bad")
          const league = data.league || "Closed"
          pill(leaguePill, league, data.phase === "closed" ? "bad" : "good")
          note.textContent = data.detail || "Leave this window open while people use the phone."
        } catch {
          pill(appPill, "Offline", "bad")
          pill(leaguePill, "Unknown", "bad")
          note.textContent = "The host is not answering."
        }
      }

      tick()
      setInterval(tick, 2000)
    </script>
  </body>
</html>
